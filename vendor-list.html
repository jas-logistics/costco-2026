<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Costco 2026 參展廠商與品項</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F4;--surface:#FFFFFF;--line:#ECE6DC;--ink:#2B2824;--sub:#8B857C;--faint:#B9B2A7;
  --ok:#6E8466;--wait:#B08457;--accent:#2B2824;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171614;--surface:#1F1D1A;--line:#2F2C27;--ink:#ECE7DE;--sub:#A09A90;--faint:#6E685F;--ok:#9DB294;--wait:#D4AA7C;--accent:#ECE7DE;}}
:root[data-theme="dark"]{--bg:#171614;--surface:#1F1D1A;--line:#2F2C27;--ink:#ECE7DE;--sub:#A09A90;--faint:#6E685F;--ok:#9DB294;--wait:#D4AA7C;--accent:#ECE7DE;}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-padding-top:70px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7;min-height:100%;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}

header{text-align:center;padding:56px 20px 36px}
.over{font-size:11px;letter-spacing:.32em;color:var(--sub);text-transform:uppercase}
h1{font-family:var(--serif);font-weight:600;font-size:32px;letter-spacing:.08em;margin-top:12px}
.rule{width:36px;height:1px;background:var(--ink);opacity:.35;margin:18px auto 14px}
.stats{font-size:13px;color:var(--sub)}
.stats b{color:var(--ink);font-weight:500}
.stats .d{margin:0 10px;color:var(--faint)}

nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:1120px;margin:0 auto;padding:0 16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:14px 12px 12px;font-size:13.5px;color:var(--sub);border-bottom:1px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.sep{flex:none;width:1px;background:var(--line);margin:14px 6px}

main{max-width:1120px;margin:0 auto;padding:44px 24px 80px}
.sec{margin-bottom:52px}
.sec-t{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-bottom:22px}
.sec-t h2{font-family:var(--serif);font-weight:500;font-size:19px;letter-spacing:.1em}
.sec-t span{font-size:12px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.card{display:flex;flex-direction:column;gap:8px;background:var(--surface);padding:24px 26px 26px;min-height:170px;transition:background .15s}
.card:hover{background:var(--bg)}
.cn{font-weight:500;font-size:16px;line-height:1.45}
.cs{font-size:12px;letter-spacing:.08em}
.cs.ok{color:var(--ok)}.cs.w{color:var(--wait)}
.ci{font-size:13px;color:var(--sub);line-height:1.75;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cm{margin-top:auto;font-size:12px;color:var(--faint)}

.back{font-size:13px;color:var(--sub);margin-bottom:28px;display:inline-block}
.back:hover{color:var(--ink)}
.vh{text-align:center;margin-bottom:40px}
.vh .over{font-size:10.5px}
.vh h2{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:.05em;margin:10px 0 6px}
.blk{max-width:760px;margin:0 auto 44px}
.blk h3{font-size:11px;letter-spacing:.28em;color:var(--sub);font-weight:500;text-align:center;margin-bottom:16px}
.il{list-style:none;border-top:1px solid var(--line)}
.il li{padding:14px 4px;border-bottom:1px solid var(--line);font-size:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.gal figure{cursor:zoom-in}
.gal img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border:1px solid var(--line)}
.gal figcaption{font-size:12px;color:var(--sub);margin-top:7px;line-height:1.5}
.none{text-align:center;font-size:13px;color:var(--faint)}
.pager{max-width:760px;margin:10px auto 0;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.pager button{font-size:13px;color:var(--sub);max-width:48%}
.pager button b{display:block;color:var(--ink);font-weight:500;font-size:14px;margin-top:2px}
.pager .nx{text-align:right;margin-left:auto}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}

.lb{display:none;position:fixed;inset:0;z-index:50;background:rgba(250,248,244,.97);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px}
.lb.open{display:flex}.lb img{max-width:90vw;max-height:76vh;object-fit:contain;background:#fff;border:1px solid var(--line)}
.lb p{font-size:13px;color:var(--sub);text-align:center}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:20px;font-size:28px;line-height:1;color:var(--sub)}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

header.home{padding:96px 20px 56px}
header.home h1{font-size:38px}
.idx{max-width:880px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:0 64px}
.col h2{font-size:11px;letter-spacing:.3em;color:var(--sub);font-weight:500;padding-bottom:14px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.col h2 span{letter-spacing:.05em}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 2px;border-bottom:1px solid var(--line);font-size:15px;transition:padding .2s,color .2s}
.row i{font-style:normal;color:var(--faint);font-size:13px;opacity:0;transition:opacity .2s}
.row:hover{padding-left:8px}.row:hover i{opacity:1}
.col.w .row{color:var(--sub)}
body.home nav{display:none}
body.home main{padding-top:8px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){
  header.home{padding:64px 18px 40px}header.home h1{font-size:28px}
  .idx{grid-template-columns:1fr;gap:44px}
  header{padding:40px 18px 28px}h1{font-size:25px}
  main{padding:30px 14px 60px}
  .grid{grid-template-columns:1fr}
  .card{padding:20px 20px 22px;min-height:0}
  .vh h2{font-size:23px}
  .gal{grid-template-columns:1fr 1fr;gap:10px}
}
</style>
</head>

<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent), V=D.vendors;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const okN=V.filter(v=>v.ok).length;
document.getElementById('stats').innerHTML=(V.length-okN?`共 <b>${V.length}</b> 家<span class="d">／</span>已確定 <b>${okN}</b><span class="d">／</span>尚未確定 <b>${V.length-okN}</b>`:`參展廠商 <b>${V.length}</b> 家`)+`${D.updated?`<span class="d">／</span>更新 ${esc(D.updated)}`:''}`;
const stt=v=>V.some(x=>!x.ok)?`<span class="cs ${v.ok?'ok':'w'}">${v.ok?'已確定':'尚未確定'}</span>`:'';
const plain=x=>x.replace(/^[①-㊿]\s?/,'');
const cur=()=>{const h=location.hash.slice(1);return V.find(v=>v.id===h)?h:'';};
function nav(){
  const c=cur();
  let h=`<button class="tab" data-go="" aria-current="${c===''}">總覽</button><span class="sep"></span>`;
  V.forEach((v,i)=>{if(i>0&&v.ok!==V[i-1].ok)h+='<span class="sep"></span>';h+=`<button class="tab" data-go="${v.id}" aria-current="${c===v.id}">${esc(v.name)}</button>`;});
  document.getElementById('tabs').innerHTML=h;
  const a=document.querySelector('.tab[aria-current="true"]');if(a)a.scrollIntoView({block:'nearest',inline:'center'});
}
function card(v){
  const txt=v.label?`共 ${v.label}`:(v.items.length?v.items.map(plain).join('、'):'品項確認中');
  const meta=v.photos.length?`${v.photos.length} 張照片`:'';
  return `<button class="card" data-go="${v.id}"><span class="cn">${esc(v.name)}</span>${stt(v)}<span class="ci">${esc(txt)}</span>${meta?`<span class="cm">${meta}</span>`:''}</button>`;
}
const U0=V.some(v=>!v.ok);
function overview(){
  const col=(t,L,c)=>`<div class="col ${c}"><h2>${t}${U0?`<span>${L.length}</span>`:''}</h2>${L.map(v=>`<button class="row" data-go="${v.id}"><span>${esc(v.name)}</span><i>→</i></button>`).join('')}</div>`;
  const U=V.filter(v=>!v.ok);
  if(!U.length){const h=Math.ceil(V.length/2);return `<div class="idx">${col('參展廠商',V.slice(0,h),'ok')}${col('&nbsp;',V.slice(h),'ok')}</div><p class="foot" style="margin-top:56px">點選廠商名稱查看品項與照片</p>`;}
  return `<div class="idx">${col('已確定廠商',V.filter(v=>v.ok),'ok')}${col('尚未確定廠商',U,'w')}</div><p class="foot" style="margin-top:56px">點選廠商名稱查看品項與照片</p>`;
}
function vendor(id){
  const i=V.findIndex(v=>v.id===id),v=V[i],pv=V[i-1],nx=V[i+1];
  return `<button class="back" data-go="">← 返回總覽</button>
  <div class="vh"><div class="over">No. ${String(i+1).padStart(2,'0')} / ${V.length}</div><h2>${esc(v.name)}</h2>${stt(v)}</div>
  <div class="blk"><h3>品項${v.label?`・${esc(v.label)}`:''}</h3>${v.items.length?`<ul class="il">${v.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="none">品項確認中</p>'}</div>
  ${v.photos.length?`<div class="blk"><h3>照片</h3><div class="gal">${v.photos.map((p,j)=>`<figure data-lb="${j}"><img src="${p.src}" alt="${esc(p.label)}" loading="lazy"><figcaption>${esc(p.label)}</figcaption></figure>`).join('')}</div></div>`:''}
  <div class="pager">${pv?`<button data-go="${pv.id}">← 上一家<b>${esc(pv.name)}</b></button>`:''}${nx?`<button class="nx" data-go="${nx.id}">下一家 →<b>${esc(nx.name)}</b></button>`:''}</div>`;
}
function render(){const c=cur();document.body.classList.toggle('home',!c);document.querySelector('header').classList.toggle('home',!c);nav();document.getElementById('main').innerHTML=c?vendor(c):overview();}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){const id=g.dataset.go;if(id)location.hash=id;else{history.pushState('',document.title,location.pathname+location.search);render();}window.scrollTo({top:0});return;}
  const f=e.target.closest('[data-lb]');
  if(f){const v=V.find(x=>x.id===cur()),p=v.photos[+f.dataset.lb];document.getElementById('lbimg').src=p.src;document.getElementById('lbcap').textContent=p.label;document.getElementById('lb').classList.add('open');return;}
  if(e.target.id==='lb'||e.target.id==='lbx')document.getElementById('lb').classList.remove('open');
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('lb').classList.remove('open');});
window.addEventListener('hashchange',render);window.addEventListener('popstate',render);
render();
})();
</script>
