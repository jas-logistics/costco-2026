<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141619">
<title>Costco 2026 現場提貨</title>
<style>
:root{
  --paper:#EEF0EC;--surface:#FFFFFF;--line:#D5D9D2;--line-2:#BFC5BC;
  --ink:#18202B;--ink-2:#4E5865;--ink-3:#8A929B;
  --slate:#18202B;--slate-2:#2A3442;
  --amber:#F2A400;--amber-ink:#7A4E00;--amber-bg:#FFF3D1;
  --go:#24724F;--go-bg:#E1EFE7;
  --idle:#C9CEC6;
  --warn:#9A3412;--warn-bg:#FFF1E6;
  --hatch:repeating-linear-gradient(135deg,var(--amber) 0 7px,#18202B 7px 14px);
  --num:"Barlow Condensed","Noto Sans TC",sans-serif;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}

header{background:var(--slate);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
header .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
header h1{font-size:17px;font-weight:700;letter-spacing:.02em}
header .sub{font-size:12px;color:#9AA4B0;margin-top:3px;display:flex;align-items:center;gap:6px}
.me{border:1px solid #3E4A5A;background:none;color:#9AA4B0;border-radius:6px;padding:5px 10px;font-size:12.5px;white-space:nowrap}
.me.set{color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:#5C6775;flex:none}
.dot.ok{background:#5FD39A}.dot.busy{background:var(--amber)}.dot.err{background:#FF7A66}
.demo{background:var(--amber-bg);color:var(--amber-ink);font-size:12.5px;padding:7px 16px}

/* building section */
.prog{background:var(--slate);color:#fff;padding:14px 16px 18px}
.count{display:flex;align-items:baseline;gap:6px;margin-bottom:14px}
.count b{font-family:var(--num);font-weight:700;font-size:64px;line-height:.85;letter-spacing:-.01em}
.count span{font-family:var(--num);font-size:30px;font-weight:500;color:#7D8896}
.count em{font-style:normal;font-size:14px;color:#C7CED6;margin-left:6px}
.count small{margin-left:auto;font-size:12.5px;color:var(--amber);align-self:center}
.bldg{position:relative;padding-left:22px}
.bldg::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:#3A4656}
.floor{position:relative;padding:9px 0 11px}
.floor+.floor{border-top:1px solid #2F3A48}
.floor::before{content:"";position:absolute;left:-19px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--slate);border:2px solid #5C6775}
.floor.f-top::before{border-color:#5FD39A;background:#5FD39A}
.floor.f-mid.live::before{border-color:var(--amber);background:var(--amber);box-shadow:0 0 0 0 rgba(242,164,0,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(242,164,0,0)}100%{box-shadow:0 0 0 0 rgba(242,164,0,0)}}
@media (prefers-reduced-motion:reduce){.floor.f-mid.live::before{animation:none}}
.fh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#C7CED6;margin-bottom:7px}
.fh b{font-family:var(--num);font-size:20px;font-weight:600;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips i{font-style:normal;font-size:12.5px;color:#66717F}
.chip{border:0;border-radius:4px;padding:5px 9px 5px 8px;font-family:var(--num);font-size:15.5px;font-weight:600;letter-spacing:.01em;line-height:1.15;background:#2E3947;color:#D7DDE3}
.chip.s1{background:var(--amber);color:#18202B}
.chip.s2{background:#fff;color:#18202B;box-shadow:inset 4px 0 0 var(--amber);padding-left:10px;position:relative}
.chip.s2::after{content:"部分";font-family:var(--sans);font-size:10.5px;font-weight:600;margin-left:6px;color:var(--amber-ink)}
.chip.s3{background:var(--go);color:#fff}

.filters{display:flex;gap:6px;overflow-x:auto;padding:16px 16px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:6px;padding:6px 12px;font-size:13.5px;color:var(--ink-2)}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.filters button span{font-family:var(--num);font-size:15px;font-weight:600;margin-left:5px;opacity:.7}

/* cargo cards */
.list{padding:8px 16px 0}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;padding-left:6px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--idle)}
.card.s1::before{background:var(--amber)}
.card.s2::before{background:var(--hatch)}
.card.s3::before{background:var(--go)}
.card.s3{background:#F7FAF8}
.card.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--amber)}100%{box-shadow:0 0 0 0 transparent}}
.top{display:flex;gap:12px;align-items:center;padding:12px 12px 10px}
.th{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none;background:var(--paper);border:1px solid var(--line)}
.th.none{display:grid;place-items:center;font-size:10.5px;color:var(--ink-3)}
.cm{flex:1;min-width:0}
.cn{font-family:var(--num);font-weight:700;font-size:21px;line-height:1.1;letter-spacing:.005em}
.card.s3 .cn{color:var(--ink-2)}
.st{display:inline-flex;align-items:center;gap:5px;margin-top:3px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--idle)}
.st.s1{color:var(--amber-ink)}.st.s1::before{background:var(--amber)}
.st.s2{color:var(--amber-ink)}.st.s2::before{background:var(--hatch);border-radius:2px;width:9px;height:9px}
.st.s3{color:var(--go)}.st.s3::before{background:var(--go)}
.more{flex:none;border:0;background:none;color:var(--ink-3);font-size:12.5px;padding:8px 2px 8px 6px;white-space:nowrap}
.note{margin:0 12px 10px;border-left:3px solid var(--warn);background:var(--warn-bg);padding:6px 10px;font-size:13.5px;color:var(--warn);white-space:pre-wrap;word-break:break-word;border-radius:0 6px 6px 0}
.btns{display:flex;gap:8px;padding:0 12px 12px}
.main{flex:1;min-height:52px;border-radius:7px;border:0;font-size:16px;font-weight:700;letter-spacing:.02em}
.main.go-up{background:var(--slate);color:#fff}
.main.go-up::after{content:" ↑";color:var(--amber)}
.main.go-done{background:var(--go);color:#fff}
.sec{flex:none;min-height:52px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font-size:14px;padding:0 14px;color:var(--ink-2);font-weight:600}
.donebar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 11px;font-size:12.5px;color:var(--ink-3)}
.donebar button{border:1px solid var(--line);background:transparent;color:var(--ink-2);font-size:13px;padding:8px 11px;border-radius:6px;min-height:40px}

.detail{display:none;border-top:1px dashed var(--line-2);padding:10px 12px 12px}
.card.open .detail{display:block}
.items{font-size:13.5px;color:var(--ink-2);line-height:1.75}
.gal{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{flex:none;width:120px;cursor:zoom-in}
.gal img{display:block;width:120px;height:100px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:#fff}
.gal figcaption{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dacts button{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:8px 12px;font-size:13.5px}

.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:30;background:var(--amber);color:var(--slate);border-radius:8px;padding:12px 14px;box-shadow:0 12px 30px rgba(24,32,43,.35);display:none;gap:10px;align-items:flex-start;max-width:600px;margin:0 auto}
.toast.show{display:flex}
.toast .tt{flex:1;font-size:15px;font-weight:600;line-height:1.45;white-space:pre-line}
.toast .tt b{display:block;font-size:12px;font-weight:500;opacity:.75;margin-bottom:2px}
.toast button{background:rgba(24,32,43,.12);border:0;color:var(--slate);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--slate);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom));font-size:13px;display:flex;align-items:center;gap:10px;justify-content:center;transform:translateY(110%);transition:transform .2s}
.savebar.show{transform:none}
.savebar button{background:var(--amber);border:0;color:var(--slate);border-radius:6px;padding:6px 14px;font-weight:700}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(24,32,43,.5);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{background:#fff;width:100%;max-width:720px;border-radius:14px 14px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.panel h3{font-size:16px;margin-bottom:4px}
.panel p{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.panel textarea,.panel input{width:100%;font:inherit;font-size:16px;border:1px solid var(--line-2);border-radius:7px;padding:10px 12px;background:var(--paper);color:var(--ink)}
.panel textarea{min-height:90px;resize:vertical}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:6px 10px;font-size:13px}
.chips2,.chips{}
#meLoc{display:flex;gap:8px;margin:10px 0 2px}
#meLoc button{flex:1;border:1px solid var(--line-2);background:#fff;border-radius:7px;min-height:44px;font-size:15px}
#meLoc button[aria-pressed="true"]{background:var(--slate);color:#fff;border-color:var(--slate)}
.pbtn{display:flex;gap:8px;margin-top:12px}
.pbtn button{flex:1;min-height:48px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font-size:15px;font-weight:600}
.pbtn .pri{background:var(--slate);border-color:var(--slate);color:#fff}

.lb{position:fixed;inset:0;z-index:50;background:rgba(14,19,26,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(50px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom))}
.lb.show{display:flex}
.lb img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:6px;background:#fff}
.lb p{color:#fff;font-size:14px;text-align:center;margin-top:12px}
.lb .cnt{color:#9AA4B0;font-family:var(--num);font-size:15px;margin-top:2px}
.lb .x{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;background:none;border:0;color:#fff;font-size:32px;line-height:1;padding:6px 10px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);border:0;color:#fff;font-size:26px;width:44px;height:60px;border-radius:6px}
.lb .pv{left:6px}.lb .nx{right:6px}
.empty{text-align:center;color:var(--ink-3);padding:30px 0;font-size:14px}
.foot{font-size:11.5px;color:var(--ink-3);text-align:center;padding:16px}

/* ===== clean light theme ===== */
:root{
  --paper:#F4F5F7;--surface:#FFFFFF;--line:#E6E8EC;--line-2:#D5D9DF;
  --ink:#1D2129;--ink-2:#5B6370;--ink-3:#9AA1AC;
  --slate:#1D2129;
  --amber:#2F6FEB;--amber-ink:#2257C5;--amber-bg:#EAF1FE;
  --go:#1F8A5B;--go-bg:#E7F4EE;
  --idle:#D5D9DF;
  --hatch:repeating-linear-gradient(135deg,#2F6FEB 0 4px,#EAF1FE 4px 8px);
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC","Noto Sans TC",sans-serif;
}
body{background:var(--paper)}
header{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:12px}
header h1{font-size:18px;letter-spacing:0}
header .sub{color:var(--ink-3)}
.me{border-color:var(--line-2);color:var(--ink-2);border-radius:999px}
.me.set{color:var(--ink)}
.dot.ok{background:#1F8A5B}.dot.busy{background:#F59E0B}
.demo{background:#FFF8E6;color:#8A5A00;border-bottom:1px solid #F5E3B5}

.prog{background:transparent;color:var(--ink);padding:16px 16px 4px}
.count{background:var(--surface);border-radius:16px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 2px rgba(29,33,41,.05)}
.count b{font-weight:700;font-size:44px;line-height:1;letter-spacing:-.02em}
.count span{font-size:22px;font-weight:500;color:var(--ink-3)}
.count em{color:var(--ink-2)}
.count small{color:var(--amber-ink);font-weight:600}
.bldg{background:var(--surface);border-radius:16px;padding:6px 16px 6px 38px;box-shadow:0 1px 2px rgba(29,33,41,.05)}
.bldg::before{left:22px;top:24px;bottom:24px;background:var(--line)}
.floor{padding:12px 0}
.floor+.floor{border-top:1px solid var(--line)}
.floor::before{left:-21px;top:18px;width:10px;height:10px;background:#fff;border:2px solid var(--idle)}
.floor.f-top::before{background:var(--go);border-color:var(--go)}
.floor.f-mid.live::before{background:var(--amber);border-color:var(--amber);animation:pingb 1.6s infinite}
@keyframes pingb{70%{box-shadow:0 0 0 8px rgba(47,111,235,0)}0%{box-shadow:0 0 0 0 rgba(47,111,235,.45)}}
.fh{color:var(--ink-2);font-size:13px;margin-bottom:8px}
.fh b{font-family:inherit;font-size:15px;color:var(--ink);font-weight:600}
.chips i{color:var(--ink-3)}
.chip{font-family:inherit;font-size:13.5px;font-weight:600;border-radius:999px;padding:5px 11px;background:#F1F3F6;color:var(--ink-2)}
.chip.s1{background:var(--amber-bg);color:var(--amber-ink)}
.chip.s2{background:#fff;color:var(--amber-ink);box-shadow:inset 0 0 0 1.5px var(--amber);padding-left:11px}
.chip.s2::after{color:var(--amber-ink);font-weight:500}
.chip.s3{background:var(--go-bg);color:var(--go)}

.filters{padding:12px 16px 6px}
.filters button{border:0;background:var(--surface);border-radius:999px;padding:7px 14px;color:var(--ink-2);box-shadow:0 0 0 1px var(--line) inset}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.filters button span{font-family:inherit;font-size:13px}

.card{border:0;border-radius:16px;padding-left:0;box-shadow:0 1px 2px rgba(29,33,41,.05)}
.card::before{display:none}
.card.s3{background:var(--surface)}
.card.s3 .th{opacity:.6}
.th{border-radius:10px;border:0}
.cn{font-family:inherit;font-size:17px;font-weight:700;letter-spacing:0}
.card.s3 .cn{color:var(--ink-3)}
.st{font-weight:500}
.st.s1,.st.s2{color:var(--amber-ink)}
.st.s2::before{background:var(--hatch);border-radius:50%;width:8px;height:8px;box-shadow:inset 0 0 0 1.5px var(--amber)}
.note{border-left:0;border-radius:10px;background:#FFF6EC;color:#9A4A12}
.main{border-radius:12px;min-height:50px;font-size:16px;letter-spacing:0}
.main.go-up{background:var(--amber);color:#fff}
.main.go-up::after{content:"";}
.sec{border-radius:12px;border:0;background:#F1F3F6;color:var(--ink-2)}
.donebar button{border:0;background:#F1F3F6;border-radius:10px;color:var(--ink-2)}
.detail{border-top:1px solid var(--line)}
.dacts button{border:0;background:#F1F3F6;border-radius:10px}
.gal img{border-radius:10px;border:0}

.toast{background:var(--ink);color:#fff;border-radius:14px}
.toast button{background:rgba(255,255,255,.15);color:#fff}
.savebar{background:var(--ink)}
.savebar button{background:#fff;color:var(--ink)}
.panel{border-radius:20px 20px 0 0}
.panel textarea,.panel input{border-radius:12px;background:#F4F5F7;border-color:var(--line)}
.quick button,#meLoc button,.pbtn button{border-radius:12px;border-color:var(--line)}
.pbtn .pri,#meLoc button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.flash{}
@keyframes flash{0%{box-shadow:0 0 0 3px rgba(47,111,235,.5)}100%{box-shadow:0 1px 2px rgba(29,33,41,.05)}}

.docbtn{display:flex;align-items:center;gap:8px;margin:0 12px 10px;width:calc(100% - 24px);border:0;background:#F1F3F6;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.docbtn span{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:13px}
.docbtn svg{flex:none}
.pk{max-height:62vh;overflow:auto;margin:6px -4px 0;-webkit-overflow-scrolling:touch}
.pkr{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.pkr .c{grid-row:span 2;font-weight:700;font-size:15px;color:var(--ink);background:#F1F3F6;border-radius:8px;text-align:center;padding:6px 0;align-self:start}
.pkr .l{font-size:14.5px;line-height:1.45}
.pkr .l b{font-weight:600;color:var(--amber-ink);margin-left:4px}
.pkr .m{font-size:12px;color:var(--ink-3)}
.pkr .m.long{color:#B4531A;font-weight:600}
.pkhead{font-size:13px;color:var(--ink-2);margin-bottom:2px}

.pkr .l{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px}
.pl img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;background:#F1F3F6;cursor:zoom-in}
.pkr .asm{font-size:12px;color:#9A4A12;background:#FFF6EC;border-radius:6px;padding:2px 7px;align-self:flex-start}

/* ===== dark theme (final) ===== */
:root{--paper:#141619;--surface:#1E2125;--line:#2C3036;--line-2:#3A3F46;--ink:#ECEDEF;--ink-2:#A9AEB5;--ink-3:#6E747C;
--amber:#C9A66B;--amber-ink:#D9BA84;--amber-bg:#2E281E;--go:#6FB38C;--go-bg:#1D2B23;--idle:#3A3F46}
body{background:var(--paper);color:var(--ink)}
header{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}
.me{border-color:var(--line-2);color:var(--ink-2)}.me.set{color:var(--ink)}
.demo{background:#2A2418;color:#D9BA84;border-color:#3A3122}
.count,.bldg,.card{background:var(--surface);box-shadow:none;border:1px solid var(--line)}
.card.s3{background:var(--surface)}
.chip{background:#2A2E33;color:var(--ink-2)}
.chip.s1{background:var(--amber);color:#1A1712}
.chip.s2{background:transparent;box-shadow:inset 0 0 0 1.5px var(--amber);color:var(--amber-ink)}
.chip.s2::after{color:var(--amber-ink)}
.chip.s3{background:var(--go-bg);color:var(--go)}
.floor::before{background:var(--surface)}
.floor.f-top::before{background:var(--go);border-color:var(--go)}
.floor.f-mid.live::before{background:var(--amber);border-color:var(--amber)}
.filters button{background:var(--surface);color:var(--ink-2);box-shadow:0 0 0 1px var(--line) inset}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.main.go-up{background:var(--ink);color:var(--paper)}
.main.go-done{background:var(--amber);color:#1A1712}
.sec,.donebar button,.dacts button,.docbtn{background:#2A2E33;color:var(--ink-2)}
.docbtn{color:var(--ink)}
.note{background:#2E2219;color:#E7B48A}
.st.s1,.st.s2{color:var(--amber-ink)}.st.s3{color:var(--go)}
.panel{background:var(--surface);color:var(--ink)}
.panel textarea,.panel input{background:#15171A;border-color:var(--line-2);color:var(--ink)}
.quick button,#meLoc button,.pbtn button{background:#2A2E33;color:var(--ink);border-color:var(--line-2)}
.pbtn .pri,#meLoc button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pkr{border-color:var(--line)}.pkr .c{background:#2A2E33;color:var(--ink)}
.toast{background:var(--amber);color:#1A1712}.toast button{background:rgba(0,0,0,.15);color:#1A1712}
.th,.gal img{background:#2A2E33}


/* pickup additions */
:root{--call:#E8866A;--call-bg:#3A231C}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:3px}
.meta .st{margin-top:0}
.tag{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;line-height:1.5;white-space:nowrap}
.tag.t-r{background:#1F2A3A;color:#8CB4E8}
.tag.t-m{background:#2A2E33;color:#8CB4E8;box-shadow:inset 0 0 0 1px #3D5A80}
.tag.t-i{background:#2E2219;color:#E7B48A}
.tag.t-n{background:#2A2E33;color:var(--ink-3)}
.chip.sn{background:var(--call);color:#1A1712}
.st.sn{color:var(--call)}.st.sn::before{background:var(--call)}
.card.sn{border-color:var(--call);box-shadow:0 0 0 1px var(--call)}
.main.go-call{background:#2A2E33;color:var(--ink);border:1px solid var(--line-2)}
.main.go-up::after{content:""}
.count small.call{color:var(--call)}
.floor.f-top::before{background:var(--surface);border-color:var(--idle)}
.floor.f-top.f-call::before{background:var(--call);border-color:var(--call);animation:pingc 1.6s infinite}
@keyframes pingc{0%{box-shadow:0 0 0 0 rgba(232,134,106,.5)}70%{box-shadow:0 0 0 8px rgba(232,134,106,0)}100%{box-shadow:0 0 0 0 rgba(232,134,106,0)}}
.floor.f-bot.f-done::before{background:var(--go);border-color:var(--go)}
@media (prefers-reduced-motion:reduce){.floor.f-top.f-call::before{animation:none}}
.foot{line-height:1.6}
</style>

<div class="sheet" id="noteSheet"><div class="panel">

</div></div>

</div></div>

let remote = {}, pending = {}, failed = [];

/* ---------- 畫面 ---------- */
function renderProg(){
  const n=[0,0,0,0,0]; VENDORS.forEach(v=>n[sOf(v)]++); const T=VENDORS.length;
  const chip=v=>`<button type="button" class="chip ${CLS[sOf(v)]}" data-jump="${v.id}">${esc(v.name)}</button>`;
  const by=(a,b)=>(+cur(b.id).t||0)-(+cur(a.id).t||0);
  const top=VENDORS.filter(v=>sOf(v)<=1).sort((a,b)=>sOf(b)-sOf(a)), mid=VENDORS.filter(v=>sOf(v)===2), bot=VENDORS.filter(v=>sOf(v)>=3).sort((a,b)=>sOf(a)-sOf(b)||by(a,b));
  $('prog').innerHTML = `
    <div class="count"><b>${n[4]}</b><span>/${T}</span><em>家已回B1</em>${n[1]?`<small class="call">${n[1]} 家可提貨</small>`:(n[3]?`<small>${n[3]} 家只下來部分</small>`:'')}</div>
    <div class="bldg">
      <div class="floor f-top${n[1]?' f-call':''}"><div class="fh">4F 會場<b>${top.length}</b></div><div class="chips">${top.map(chip).join('')||'<i>4F 已經清空了</i>'}</div></div>
      <div class="floor f-mid${mid.length?' live':''}"><div class="fh">搬下B1中<b>${mid.length}</b></div><div class="chips">${mid.map(chip).join('')||'<i>目前沒有</i>'}</div></div>
      <div class="floor f-bot${bot.length?' f-done':''}"><div class="fh">B1 倉庫<b>${bot.length}</b></div><div class="chips">${bot.map(chip).join('')||'<i>還沒有貨下來</i>'}</div></div>
    </div>`;
  const F=[['all','全部',T],['1','可提貨',n[1]],['2','搬下中',n[2]],['3','只下來部分',n[3]],['0','4F 等通知',n[0]],['4','已回B1',n[4]]];
  $('filters').innerHTML = F.map(([k,l,c])=>`<button type="button" data-f="${k}" aria-pressed="${filter===k}">${l}<span>${c}</span></button>`).join('');
}

  const stamp = esc([c.by,fmtT(c.t)].filter(Boolean).join(' · '));
  let btns='';
  if (s===0) btns=`<div class="btns"><button type="button" class="main go-call" data-to="${v.id}|1">主辦通知可提貨</button></div>`;
  else if (s===1) btns=`<div class="btns"><button type="button" class="main go-up" data-to="${v.id}|2">開始搬下B1 ↓</button></div>`;
  else if (s===2) btns=`<div class="btns"><button type="button" class="main go-done" data-to="${v.id}|4">全部回B1了 ✓</button>${v.items.length>1?`<button type="button" class="sec" data-part="${v.id}">只下來部分</button>`:''}</div>`;
  else if (s===3) btns=`<div class="btns"><button type="button" class="main go-up" data-to="${v.id}|2">剩下的搬下B1 ↓</button><button type="button" class="sec" data-to="${v.id}|4">全部回B1了</button></div>`;
  const back = s===4?2:s===3?2:s-1;
  if (s>0) btns+=`<div class="donebar"><span>${stamp}</span><button type="button" data-undo="${v.id}|${back}">按錯了，退回${ST[back]}</button></div>`;
  return `<article class="card ${CLS[s]}${open?' open':''}" id="c-${v.id}">
    <div class="top">${thumb}<div class="cm"><div class="cn">${esc(v.name)}</div><div class="meta"><span class="st ${CLS[s]}">${ST[s]}</span><span class="tag t-${dk}">${dl}</span></div></div>
      <button type="button" class="more" data-open="${v.id}" aria-expanded="${open}">${open?'收起 ▴':`品項${np?'・照片':''} ▾`}</button></div>
    ${c.note?`<div class="note">${esc(c.note)}</div>`:''}
    ${(v.pack||[]).length?`<button type="button" class="docbtn" data-doc="${v.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>裝箱明細<span>${v.ptot} 箱</span></button>`:''}
    ${btns}
    <div class="detail">
      <div class="items">${v.items.map(esc).join('<br>')}</div>
      ${np?`<div class="gal">${v.photos.map((x,i)=>`<figure data-lb="${v.id}|${i}"><img src="${x.src}" alt="${esc(x.label)}" loading="lazy"><figcaption>${esc(x.label)}</figcaption></figure>`).join('')}</div>`:''}
      <div class="dacts"><button type="button" data-note="${v.id}">${c.note?'修改備註':'＋ 備註'}</button>${s!==0?`<button type="button" data-reset="${v.id}">改回 4F 等通知</button>`:''}</div>
    </div></article>`;
}
function renderList(){
  const L = VENDORS.filter(v=>filter==='all'||String(sOf(v))===filter)
    .sort((a,b)=>ORDER.indexOf(sOf(a))-ORDER.indexOf(sOf(b)) || (sOf(a)===1? (+cur(a.id).t||0)-(+cur(b.id).t||0) : 0));
  $('list').innerHTML = L.length ? L.map(cardHTML).join('') : '<p class="empty">這個分類目前沒有廠商</p>';
}
function renderConn(){
  const dot=$('dot'), tx=$('connText');
    if (failed.length){dot.className='dot err';tx.textContent='有變更沒存到';return;}
  if (busy){dot.className='dot busy';tx.textContent='儲存中…';return;}
  if (!lastOk){dot.className='dot';tx.textContent='連線中…';return;}
  dot.className='dot ok'; tx.textContent='已同步 '+fmtT(lastOk);
}
function renderBar(){
  const b=$('savebar');
  if (failed.length){ $('saveMsg').textContent=failed.length+' 筆變更沒存到（'+(lastErr||'訊號不好？')+'）'; $('retry').hidden=false; b.classList.add('show'); }
  else b.classList.remove('show');
}
function renderMe(){ const b=$('meBtn'); b.textContent = me.name ? (me.loc?me.loc+' · ':'')+me.name : '名字（選填）'; b.classList.toggle('set',!!me.name); }
function render(){ const y=window.scrollY; renderProg(); renderList(); renderConn(); renderBar(); renderMe(); window.scrollTo(0,y); }

/* ---------- 通知 ---------- */
let audioCtx=null, toastT=null;
function beep(){ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const t=audioCtx.currentTime;
  [0,0.22,0.44].forEach(d=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.3,t+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.18);o.start(t+d);o.stop(t+d+0.2);}); }catch(e){} }
function toast(title,msg){ $('toastText').innerHTML=`<b>${esc(title)}</b>${esc(msg)}`; $('toast').classList.add('show'); beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  clearTimeout(toastT); toastT=setTimeout(()=>$('toast').classList.remove('show'),20000); }
function diffNotify(prev,next){
  if (first) return; const msgs=[];
  VENDORS.forEach(v=>{ if(pending[v.id]) return; const a=prev[v.id]||{}, b=next[v.id]||{}; const sa=+a.s||0, sb=+b.s||0;
    if (sb===sa){ if (b.note && b.note!==a.note) msgs.push(`${v.name} 備註：${b.note}`); return; }
    if (sb===1) msgs.push(`${v.name} 可以提貨了（${dispOf(v.id)[0]}）`);
    else if (sb===2) msgs.push(`${v.name} 正在搬下B1`);
    else if (sb===3) msgs.push(`${v.name} 只下來部分${b.note?'：'+b.note:''}`);
    else if (sb===4) msgs.push(`${v.name} 已回B1`); });
  if (msgs.length) toast(msgs.length>1?msgs.length+' 則更新':'更新', msgs.slice(0,4).join('\n')+(msgs.length>4?'\n…':''));
}

/* ---------- 資料（Google 試算表，和送貨頁共用；提貨用 v101～v117） ---------- */
const API_URL = "https://script.google.com/macros/s/AKfycbx3JPZgC4V-XPFXC4To6NP-MWa4DO7kSIBe36xI__vbsAXUc9fEDO_WD9IN4B7ynSS1/exec";
const POLL_MS = 10000; let lastErr='';
const toKey = id => 'v'+(100+parseInt(id.slice(1),10));
const fromKey = k => { const m=/^v(\d+)$/.exec(k); const n=m?+m[1]:0; return n>100&&n<200 ? 'v'+(n-100) : null; };
async function pull(){
  try{
    const r=await fetch(API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    const j=await r.json(); if(!j.ok) throw 0;
    const next={}; for (const k in (j.data||{})){ const id=fromKey(k); if(id) next[id]=j.data[k]; }
    const prev=remote; remote=next; diffNotify(prev,remote); first=false; lastOk=Date.now();
    for (const k in pending){ const p=pending[k], rr=remote[k]||{}; if(['s','note'].every(f=>String(rr[f]??'')===String(p[f]??''))) delete pending[k]; }
  }catch(e){ if(!lastOk) $('connText').textContent='連不上，稍後重試'; }
  render();
}
async function push(id, patch, label){
  const full=Object.assign({s:0,note:''}, remote[id]||{}, pending[id]||{}, patch);
  pending[id]=full; render();
  busy++; renderConn();
  try{
    const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({key:toKey(id),by:who(),label:label||('提貨 '+vById(id).name+' → '+ST[+full.s]),s:+full.s,note:String(full.note||'')})});
    const j=await r.json(); if(!j.ok){ lastErr=String(j.error||'儲存失敗'); throw 0; }
    lastErr=''; lastOk=Date.now(); failed=failed.filter(x=>x!==id); await pull();
  }catch(e){ if(!lastErr) lastErr='連不到試算表'; if(!failed.includes(id)) failed.push(id); }
  busy--; render();
}
async function retryAll(){ const f=failed; failed=[]; for (const id of f) if(pending[id]) await push(id,pending[id]); render(); }

/* ---------- 操作 ---------- */
let askFn=null;
function ask(msg,fn){ askFn=fn; $('askText').textContent=msg; openSheet('askSheet'); }
function openSheet(id){ $(id).classList.add('show'); }
function closeSheets(){ document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('show')); }
let lbV=null, lbI=0;
function lbShow(){ const x=lbV.photos[lbI]; $('lbImg').src=x.src; $('lbCap').textContent=lbV.name+'・'+x.label; $('lbCnt').textContent=(lbI+1)+' / '+lbV.photos.length; $('lbP').hidden=$('lbN').hidden=lbV.photos.length<2; $('lb').classList.add('show'); }
function lbGo(d){ lbI=(lbI+d+lbV.photos.length)%lbV.photos.length; lbShow(); }
const shortItem = x => x.split(/[（(]/)[0].trim();

document.addEventListener('click', e=>{
  const fg=e.target.closest('[data-lb]'); if(fg){ const [vid,i]=fg.dataset.lb.split('|'); lbV=vById(vid); lbI=+i; lbShow(); return; }
  const t=e.target.closest('button'); if(!t) return;
  if (t.dataset.jump){ const id=t.dataset.jump; if(filter!=='all'&&String(sOf(vById(id)))!==filter){filter='all';render();} const el=$('c-'+id); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } return; }
  if (t.dataset.f){ filter=t.dataset.f; render(); return; }
  if (t.dataset.open){ openId=openId===t.dataset.open?null:t.dataset.open; render(); return; }
  if (t.dataset.to){ const [id,s]=t.dataset.to.split('|'); const patch={s:+s}; if (+s===4) patch.note=''; push(id, patch); return; }
  if (t.dataset.part){ sheetFor=t.dataset.part; const v=vById(sheetFor); $('partTitle').textContent=v.name+'：只下來部分';
    $('partInput').value=cur(sheetFor).note||'';
    $('partQuick').innerHTML = v.items.map((x,i)=>`<button type="button" data-q="${i}">${esc(shortItem(x))}</button>`).join('');
    openSheet('partSheet'); return; }
  if (t.dataset.q){ const v=vById(sheetFor), q=shortItem(v.items[+t.dataset.q]), i=$('partInput'); i.value=(i.value.trim()?i.value.trim()+'、':'還在4F：')+q; return; }
  if (t.dataset.undo){ const [id,to]=t.dataset.undo.split('|'); const v=vById(id); ask(`${v.name} 退回「${ST[+to]}」？`,()=>push(id,{s:+to})); return; }
  if (t.dataset.reset){ const v=vById(t.dataset.reset); ask(v.name+' 改回「4F 等通知」？',()=>push(v.id,{s:0})); return; }
  if (t.dataset.doc){ const v=vById(t.dataset.doc); $('pkTitle').textContent=v.name+' 裝箱明細';
    $('pkHead').textContent=`共 ${v.ptot} 箱・紅字是超過 2 公尺的長箱`;
    $('pkList').innerHTML=v.pack.map(r=>{const long=(r.d||'').split('×').some(x=>parseFloat(x)>2);
      return `<div class="pkr"><div class="c">${esc(r.c)}</div><div class="l">${r.l.map(([d,q,pi])=>`<div class="pl">${pi>=0?`<img src="${v.photos[pi].src}" alt="" data-lb="${v.id}|${pi}">`:''}<span>${esc(d)}<b>×${q}</b></span></div>`).join('')}${r.a?`<span class="asm">${esc(r.a)}</span>`:''}</div><div class="m${long?' long':''}">${r.d?esc(r.d)+' m':''}${r.w?'・'+r.w+' kg':''}</div></div>`;}).join('');
    openSheet('pkSheet'); $('pkList').scrollTop=0; return; }
  if (t.dataset.note){ sheetFor=t.dataset.note; $('noteTitle').textContent=vById(sheetFor).name+' 備註'; $('noteInput').value=cur(sheetFor).note||''; openSheet('noteSheet'); return; }
});
$('pkClose').onclick=closeSheets;
$('askNo').onclick=closeSheets;
$('askYes').onclick=()=>{ const f=askFn; askFn=null; closeSheets(); f&&f(); };
$('partCancel').onclick=closeSheets;
$('partSave').onclick=()=>{ const n=$('partInput').value.trim(); push(sheetFor,{s:3,note:n}); closeSheets(); };
$('noteCancel').onclick=closeSheets;
$('noteClear').onclick=()=>{ push(sheetFor,{note:''}); closeSheets(); };
$('noteSave').onclick=()=>{ push(sheetFor,{note:$('noteInput').value.trim()}); closeSheets(); };
document.querySelectorAll('.sheet').forEach(sh=>sh.addEventListener('click',e=>{ if(e.target===sh) closeSheets(); }));
$('toastClose').onclick=()=>$('toast').classList.remove('show');
$('retry').onclick=retryAll;
$('lbX').onclick=()=>$('lb').classList.remove('show'); $('lbP').onclick=()=>lbGo(-1); $('lbN').onclick=()=>lbGo(1);
$('lb').addEventListener('click',e=>{ if(e.target.id==='lb') $('lb').classList.remove('show'); });
let tx=null; $('lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('lb').addEventListener('touchend',e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>50) lbGo(dx<0?1:-1); tx=null; });
$('meBtn').onclick=()=>{ $('meName').value=me.name||''; document.querySelectorAll('#meLoc button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.loc===me.loc)); openSheet('meSheet'); };
$('meLoc').addEventListener('click',e=>{ const b=e.target.closest('[data-loc]'); if(!b) return; document.querySelectorAll('#meLoc button').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
$('meSave').onclick=()=>{ const sel=document.querySelector('#meLoc [aria-pressed="true"]'); me={name:$('meName').value.trim(),loc:sel?sel.dataset.loc:''}; ls.set('pu-me',me); closeSheets(); render(); };
document.addEventListener('pointerdown',()=>{ try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); audioCtx.resume&&audioCtx.resume(); }catch(e){} },{once:true});

render(); pull(); setInterval(()=>{ if(!document.hidden) pull(); }, POLL_MS);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); });
</script>
